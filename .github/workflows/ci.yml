# Runs every suite on every push, on the Python version Render actually uses.
# There was no CI before the final pre-launch audit, so a change that broke the
# build was only found by whoever next ran the tests by hand - or by a deploy.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"   # Render's PYTHON_VERSION, not .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4   # the engine parity tests shell out to node
        with:
          node-version: 24
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://ope-forecast-dj78.onrender.com

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
